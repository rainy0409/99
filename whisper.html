<style>

  .toast{position:fixed;left:50%;bottom:2.4rem;transform:translateX(-50%) translateY(20px);

    color:var(--tx);font-size:.7rem;letter-spacing:.1em;box-shadow:0 16px 44px -18px rgba(0,0,0,.65);
    opacity:0;pointer-events:none;transition:opacity .35s,transform .35s var(--ease);z-index:60;
    backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur))}

  .empty{text-align:center;padding:3.6rem 1rem;color:var(--tx-3);font-size:var(--fs-md);line-height:2}

    font-size:var(--fs-xs);color:var(--tx-3);letter-spacing:.04em;line-height:1.8}

<script>
document.addEventListener('DOMContentLoaded', function () {
  /* ═══════════════════════════════════════════════════════════
     WhisperStore：数据层（localStorage 本地；可换后端）
     ═══════════════════════════════════════════════════════════ */
  var WhisperStore = {
    KEY: 'rd-whispers',
    load: function () {
      try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); }
      catch (e) { return []; }
    },
    save: function (list) {
      try { localStorage.setItem(this.KEY, JSON.stringify(list)); }
      catch (e) { /* ignore */ }
    },
    remove: function (key) {
      this.save(this.load().filter(function (m) { return (m.id || m.t) !== key; }));
    },
    add: function (msg) {
      var list = this.load();
      list.push(msg);
      this.save(list);
    }
  };

  var who = 'him', tag = '';
  var ta = document.getElementById('mi'), ml = document.getElementById('ml');
  var toastEl = document.getElementById('toast'), toastTimer = 0;
  function flash(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }

  function esc(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtAbs(t) {
    var d = new Date(t);
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function fmtRel(t) {
    var s = Math.floor((Date.now() - t) / 1000);
    if (s < 60) return '刚刚';
    var m = Math.floor(s / 60); if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60); if (h < 24) return h + ' 小时前';
    var days = Math.floor(h / 24);
    if (days === 1) return '昨天';
    if (days < 7) return days + ' 天前';
    return fmtAbs(t).split(' ')[0];
  }
  function dayKey(t) {
    var d = new Date(t);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function dayLabel(t) {
    var d = new Date(t), now = new Date();
    if (dayKey(t) === dayKey(now.getTime())) return '今天';
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (dayKey(y.getTime()) === dayKey(t)) return '昨天';
    return d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate());
  }
  function uid() { return Date.now() + '-' + Math.random().toString(36).slice(2, 7); }

  function render() {
    var list = WhisperStore.load().sort(function (a, b) { return b.t - a.t; });
    document.getElementById('wCount').textContent = list.length;
    document.getElementById('wHim').textContent = list.filter(function (m) { return m.w === 'him'; }).length;
    document.getElementById('wHer').textContent = list.filter(function (m) { return m.w === 'her'; }).length;

    if (!list.length) {
      ml.innerHTML = '<div class="empty">还没有悄悄话，<br>写下第一句吧 ♡</div>';
      return;
    }
    var html = '', lastDay = '';
    list.forEach(function (m, i) {
      var dk = dayKey(m.t);
      if (dk !== lastDay) {
        html += '<div class="day-sep"><span>' + dayLabel(m.t) + '</span></div>';
        lastDay = dk;
      }
      html += '<div class="msg ' + m.w + '" style="animation-delay:' + (i * 0.04) + 's">' +
        '<button class="del" data-id="' + (m.id || m.t) + '" data-cur title="删除">' +
          '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
        '<div class="mh"><span class="nm">' + (m.w === 'him' ? '我' : '下雨天') + '</span>' +
        '<span class="mt"><span class="tm">' + fmtAbs(m.t) + '</span>' +
        '<span class="rel">' + fmtRel(m.t) + '</span></span></div>' +
        (m.g ? '<span class="tag">' + esc(m.g) + '</span>' : '') +
        '<div class="bo">' + esc(m.b) + '</div></div>';
    });
    ml.innerHTML = html;
  }

  /* 身份切换 */
  Array.prototype.forEach.call(document.querySelectorAll('.who button'), function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.who button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); who = b.dataset.who;
      ta.placeholder = who === 'him' ? '今天也很想你……' : '想跟他说点什么呢……';
    });
  });

  /* 心情标签 */
  document.getElementById('tags').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var on = b.classList.contains('on');
    document.querySelectorAll('#tags button').forEach(function (x) { x.classList.remove('on'); });
    if (!on) { b.classList.add('on'); tag = b.dataset.tag; } else { tag = ''; }
  });

  /* 字数 */
  ta.addEventListener('input', function () {
    document.getElementById('cnt').textContent = ta.value.length + ' / 300';
  });

  /* 发送 */
  document.getElementById('send').addEventListener('click', function (e) {
    var v = ta.value.trim();
    if (!v) { ta.focus(); ta.style.borderColor = 'var(--rose)';
      setTimeout(function () { ta.style.borderColor = ''; }, 900); return; }
    WhisperStore.add({ id: uid(), w: who, b: v, g: tag, t: Date.now() });
    ta.value = ''; document.getElementById('cnt').textContent = '0 / 300';
    document.querySelectorAll('#tags button').forEach(function (x) { x.classList.remove('on'); });
    tag = '';
    render();
    var r = e.currentTarget.getBoundingClientRect();
    if (window.rdSpark) window.rdSpark(r.left + r.width / 2, r.top + r.height / 2, 30);
  });

  /* Ctrl+Enter 快捷发送 */
  ta.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') document.getElementById('send').click();
  });

  /* 删除 */
  ml.addEventListener('click', function (e) {
    var b = e.target.closest('.del'); if (!b) return;
    WhisperStore.remove(b.dataset.id);
    render();
  });

  /* 导出备份（跨设备同步用） */
  document.getElementById('exp').addEventListener('click', function () {
    var data = WhisperStore.load();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'whispers-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click(); URL.revokeObjectURL(url);
    flash('已导出 ' + data.length + ' 条悄悄话');
  });

  /* 导入备份（合并去重） */
  document.getElementById('imp').addEventListener('click', function () { document.getElementById('impFile').click(); });
  document.getElementById('impFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var arr = JSON.parse(reader.result);
        if (!Array.isArray(arr)) throw 0;
        var byId = {}, cur = WhisperStore.load();
        cur.forEach(function (m) { byId[m.id || m.t] = m; });
        var added = 0;
        arr.forEach(function (m) {
          if (m && m.b && m.t && !byId[m.id || m.t]) { byId[m.id || m.t] = m; added++; }
        });
        WhisperStore.save(Object.keys(byId).map(function (k) { return byId[k]; }));
        render();
        flash(added ? ('已导入 ' + added + ' 条新悄悄话') : '没有新内容可导入');
      } catch (err) { flash('文件格式不对，导入失败'); }
      e.target.value = '';
    };
    reader.readAsText(f);
  });

  render();
});
</script>
</body>
</html>
