    { file:'campus-girl', idx:'02', nm:'校园女孩', en:'Campus',   ds:'回到初遇那年的走廊，你抬头看了我一眼。' },
    { file:'anime-girl',  idx:'03', nm:'动漫女孩', en:'Anime',    ds:'我心里，你一直是这个样子——会发光的。' }
  ];

  var grid = document.getElementById('bbGrid');
  if (!grid) return;

  /* ── 渲染卡片 ── */
  grid.innerHTML = BOXES.map(function (b, i) {
    return ''
    + '<article class="bb" data-file="' + b.file + '">'
    +   '<div class="bb-stage" role="button" tabindex="0" aria-label="打开盲盒 ' + b.nm + '">'
    +     '<div class="bb-halo"></div>'
    +     '<div class="bb-shadow"></div>'
    +     '<div class="bb-box' + (REDUCE ? '' : ' bb-float') + '" style="animation-delay:' + (i * 0.9) + 's">'
    +       '<div class="bb-base bb-face bb-front">'
    +         '<div class="bb-rain"></div>'
    +         '<div class="bb-inner"></div>'
    +         '<div class="bb-engrave"></div>'
    +         '<div class="bb-hair"></div>'
    +         '<div class="bb-sheen"></div>'
    +         '<div class="bb-motif">' + ROMAN[i] + '</div>'
    +       '</div>'
    +       '<div class="bb-face bb-side bb-side-l"></div>'
    +       '<div class="bb-face bb-side bb-side-r"></div>'
    +       '<div class="bb-top-hinge">'
    +         '<div class="bb-lid">'
    +           '<div class="bb-lid-face">'
    +             '<div class="bb-engrave"></div>'
    +             '<div class="bb-hair"></div>'
    +           '</div>'
    +         '</div>'
    +       '</div>'
    +     '</div>'
    +     '<div class="bb-bloom"></div>'
    +     '<div class="bb-burst"><i class="bb-ring"></i><i class="bb-ring"></i><i class="bb-ring"></i></div>'
    +     '<div class="bb-flash"></div>'
    +     '<div class="bb-view"><canvas></canvas></div>'
    +     '<div class="bb-prog" hidden>'
    +       '<svg viewBox="0 0 58 58"><circle class="trk" cx="29" cy="29" r="25"></circle><circle class="bar" cx="29" cy="29" r="25"></circle></svg>'
    +       '<span class="txt">载入中 0%</span>'
    +     '</div>'
    +     '<div class="bb-err">模型加载失败<br>请检查网络后重试</div>'
    +     '<div class="bb-info">'
    +       '<div class="bb-info-nm">' + b.nm + '</div>'
    +       '<span class="bb-info-en">' + b.en + '</span>'
    +       '<div class="bb-info-ds">' + b.ds + '</div>'
    +     '</div>'
    +     '<button class="bb-reset" type="button" title="重新封盒" aria-label="重新封盒">&#8634;</button>'
    +   '</div>'
    +   '<div class="bb-tag">轻触开启</div>'
    + '</article>';
  }).join('');

  /* 量取真实尺寸 → 注入 3D 立方体变量 */
  Array.prototype.forEach.call(grid.querySelectorAll('.bb-stage'), function (st) {
    var w = st.clientWidth || 300, h = st.clientHeight || 400;
    st.style.setProperty('--w', w + 'px');
    st.style.setProperty('--h', h + 'px');
    st.style.setProperty('--d', Math.max(42, Math.round(w * 0.3)) + 'px');
  });

  /* ── 等 GSAP 就位 ── */
  function whenGsap(cb) {
    if (window.gsap) return cb(window.gsap);
    var n = 0, t = setInterval(function () {
      if (window.gsap) { clearInterval(t); cb(window.gsap); }
      else if (++n > 120) { clearInterval(t); cb(null); }
    }, 50);
  }

  /* ═════════ Three.js 展示器 ═════════ */
  var viewers = {};

  function envMap(renderer) {
    var c = document.createElement('canvas'); c.width = 32; c.height = 32;
    var g = c.getContext('2d');
    var grd = g.createLinearGradient(0, 0, 0, 32);
    grd.addColorStop(0, '#fff3ea');
    grd.addColorStop(0.46, '#e8c7ff');
    grd.addColorStop(1, '#2a2038');
    g.fillStyle = grd; g.fillRect(0, 0, 32, 32);
    var tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    var pm = new THREE.PMREMGenerator(renderer);
    var env = pm.fromEquirectangular(tex).texture;
    pm.dispose(); tex.dispose();
    return env;
  }

  function shadowPlane() {
    var c = document.createElement('canvas'); c.width = c.height = 128;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(64, 64, 4, 64, 64, 62);
    grd.addColorStop(0, 'rgba(0,0,0,0.5)');
    grd.addColorStop(0.55, 'rgba(0,0,0,0.2)');
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    var tex = new THREE.CanvasTexture(c);
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(3.4, 3.4),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false })
    );
    m.rotation.x = -Math.PI / 2;
    return m;
  }

  function makeViewer(stage, file) {
    if (viewers[file]) return viewers[file];

    var view   = stage.querySelector('.bb-view');
    var canvas = view.querySelector('canvas');
    var prog   = stage.querySelector('.bb-prog');
    var bar    = prog.querySelector('.bar');
    var ptxt   = prog.querySelector('.txt');
    var errEl  = stage.querySelector('.bb-err');

    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({
        canvas: canvas, alpha: true, antialias: !MOBILE,
        premultipliedAlpha: true, powerPreference: 'high-performance'
      });
    } catch (e) { errEl.classList.add('on'); return null; }

    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, MOBILE ? 1.75 : 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;

    var scene  = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
    camera.position.set(0, 0.18, 5.2);
    camera.lookAt(0, 0.1, 0);

    scene.environment = envMap(renderer);

    /* 暖调浪漫布光 */
    scene.add(new THREE.HemisphereLight(0xffeaf0, 0x2a1830, 0.62));
    var key = new THREE.DirectionalLight(0xfff0e6, 1.2); key.position.set(2.6, 3.4, 4.2); scene.add(key);
    var fil = new THREE.DirectionalLight(0xc9b6ff, 0.5); fil.position.set(-3.2, 1.0, -1.8); scene.add(fil);
    var rim = new THREE.DirectionalLight(0xff9bb6, 0.82); rim.position.set(-1.4, -1.2, -3.6); scene.add(rim);

    var pivot = new THREE.Group(); scene.add(pivot);
    var shadow = shadowPlane(); shadow.position.y = -1.32; shadow.visible = false; scene.add(shadow);

    var model = null, baseY = 0, spin = 0.42, running = false, raf = 0;
    var autoRot = true, drag = false, lastX = 0, vel = 0, relTimer = 0, isOpen = false;

    function resize() {
      var w = view.clientWidth || 300, h = view.clientHeight || 400;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    resize();

    var t0 = performance.now();
    function frame() {
      if (!running) return;
      raf = requestAnimationFrame(frame);
      var t = (performance.now() - t0) / 1000;
      if (model) {
        if (autoRot) pivot.rotation.y += spin * 0.016;
        pivot.position.y = baseY + Math.sin(t * 1.1) * 0.03;
      }
      try { renderer.render(scene, camera); } catch (e) { running = false; }
    }
    function start() { if (!running) { running = true; raf = requestAnimationFrame(frame); } }
    function stop()  { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }

    /* 视口外自动停帧（仅在盒子关闭时才停，打开期间不被误杀） */
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (es) {
        es.forEach(function (e) {
          if (e.isIntersecting) { if (model) start(); }
          else if (!isOpen) stop();
        });
      }, { threshold: 0.05 }).observe(stage);
    }
    addEventListener('resize', resize, { passive: true });

    /* 拖拽旋转 + 惯性 */
    canvas.addEventListener('pointerdown', function (e) {
      drag = true; lastX = e.clientX; autoRot = false; vel = 0;
      clearTimeout(relTimer);
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - lastX; lastX = e.clientX;
      pivot.rotation.y += dx * 0.009; vel = dx * 0.009;
    });
    function release() {
      if (!drag) return;
      drag = false;
      var decay = function () {
        if (Math.abs(vel) < 0.0008 || autoRot) return;
        pivot.rotation.y += vel; vel *= 0.94; requestAnimationFrame(decay);
      };
      decay();
      relTimer = setTimeout(function () { autoRot = true; }, 2600);
    }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('pointerleave', release);

    /* GLB 载入 */
    function fit(m) {
      var box = new THREE.Box3().setFromObject(m);
      var size = box.getSize(new THREE.Vector3());
      var ctr  = box.getCenter(new THREE.Vector3());
      var maxD = Math.max(size.x, size.y, size.z) || 1;
      var s = 2.35 / maxD;
      m.scale.setScalar(s);
      m.position.set(-ctr.x * s, -ctr.y * s, -ctr.z * s);
      shadow.position.y = -(size.y * s) / 2 - 0.06;
      shadow.scale.setScalar(Math.max(0.55, (size.x * s) / 1.6));
      return m;
    }

    var loaded = null;
    function load() {
      if (loaded) return loaded;
      prog.hidden = false;
      var loader = new THREE.GLTFLoader();
      loaded = new Promise(function (resolve) {
        loader.load('assets/models/' + file + '.glb',
          function (gltf) {
            model = fit(gltf.scene);
            model.traverse(function (c) {
              if (c.isMesh && c.material) {
                var ms = Array.isArray(c.material) ? c.material : [c.material];
                ms.forEach(function (mt) {
                  if (mt.map) mt.map.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
                  mt.envMapIntensity = 0.6;
                  if ('roughness' in mt) mt.roughness = Math.min(1, (mt.roughness == null ? 0.8 : mt.roughness));
                });
              }
            });
            pivot.add(model);
            pivot.rotation.y = -Math.PI * 0.85;
            baseY = pivot.position.y;
            shadow.visible = true;
            prog.style.opacity = '0';
            setTimeout(function () { prog.hidden = true; }, 450);
            resize(); start();
            resolve(true);
          },
          function (xhr) {
            if (xhr && xhr.lengthComputable && xhr.total) {
              var p = Math.min(1, xhr.loaded / xhr.total);
              bar.style.strokeDashoffset = String(157 * (1 - p));
              ptxt.textContent = '载入中 ' + Math.round(p * 100) + '%';
            } else { ptxt.textContent = '载入中…'; }
          },
          function (err) {
            console.warn('[BB] GLB 加载失败 ' + file, err && err.message);
            try { errEl.innerHTML += '<br><small style="opacity:.7">' + (err && err.message ? err.message : err) + '</small>'; } catch (e) {}
            prog.hidden = true; errEl.classList.add('on');
            resolve(false);
          });
      });
      return loaded;
    }

    var api = {
      load: load, start: start, stop: stop, resize: resize,
      get pivot() { return pivot; },
      get ready() { return !!model; },
      lockAuto: function (v) { autoRot = !v; },
      setOpen: function (v) { isOpen = v; if (v) start(); }
    };
    viewers[file] = api;
    return api;
  }

  /* ═════════ 开盒时间线（浪漫·光溢）═════════ */
  whenGsap(function (gsap) {

    var cards = Array.prototype.slice.call(grid.querySelectorAll('.bb'));
    var current = null;

    cards.forEach(function (card) {
      var file  = card.dataset.file;
      var stage = card.querySelector('.bb-stage');
      var box   = card.querySelector('.bb-box');
      var lid   = card.querySelector('.bb-lid');
      var inner = card.querySelector('.bb-inner');
      var halo  = card.querySelector('.bb-halo');
      var base  = card.querySelector('.bb-base');
      var bloom = card.querySelector('.bb-bloom');
      var burst = card.querySelector('.bb-burst');
      var rings = card.querySelectorAll('.bb-ring');
      var view  = card.querySelector('.bb-view');
      var info  = card.querySelector('.bb-info');
      var reset = card.querySelector('.bb-reset');
      var flash = card.querySelector('.bb-flash');
      var opened = false, tl = null;

      /* ── 磁吸 3D 倾斜（跟手且丝滑）── */
      if (gsap && !REDUCE && matchMedia('(hover:hover)').matches) {
        var rX = gsap.quickTo(box, 'rotationX', { duration: 0.55, ease: 'power3' });
        var rY = gsap.quickTo(box, 'rotationY', { duration: 0.55, ease: 'power3' });
        stage.addEventListener('pointermove', function (e) {
          var r = stage.getBoundingClientRect();
          var px = (e.clientX - r.left) / r.width;
          var py = (e.clientY - r.top) / r.height;
          if (!opened) { rY((px - 0.5) * 16); rX(-(py - 0.5) * 12); }
          var mx = (px * 100).toFixed(1) + '%', my = (py * 100).toFixed(1) + '%';
          card.querySelectorAll('.bb-sheen').forEach(function (el) {
            el.style.setProperty('--mx', mx); el.style.setProperty('--my', my);
          });
        });
        stage.addEventListener('pointerleave', function () { rX(0); rY(0); });
      }

      /* ── 悬停预取模型字节 ── */
      var prefetched = false;
      function prefetch() {
        if (prefetched) return; prefetched = true;
        try { fetch('assets/models/' + file + '.glb', { cache: 'force-cache' }); } catch (e) {}
      }
      stage.addEventListener('pointerenter', prefetch, { once: true });
      if (window.IntersectionObserver) {
        new IntersectionObserver(function (es, o) {
          es.forEach(function (e) { if (e.isIntersecting) { prefetch(); o.disconnect(); } });
        }, { rootMargin: '200px' }).observe(stage);
      }

      /* ── 主时间线 ── */
      function open() {
        if (opened) return; opened = true;
        if (current && current !== card) current._close();
        current = card;
        card.classList.add('opened');
        box.classList.remove('bb-float');
        stage.setAttribute('aria-expanded', 'true');

        var vw = makeViewer(stage, file);
        if (vw) { vw.setOpen(true); vw.load(); }

        /* 柔光粒子 */
        var PN = MOBILE ? 14 : 22;
        for (var i = 0; i < PN; i++) {
          var p = document.createElement('i'); p.className = 'bb-pt';
          if (i % 3 === 0) { p.style.background = 'var(--rose)'; p.style.boxShadow = '0 0 9px var(--rose)'; }
          if (i % 4 === 0) { p.style.background = 'var(--violet)'; p.style.boxShadow = '0 0 9px var(--violet)'; }
          burst.appendChild(p);
        }
        var pts = burst.querySelectorAll('.bb-pt');

        if (!gsap) {
          lid.style.display = 'none'; view.style.opacity = '1'; info.style.opacity = '1';
          return;
        }

        gsap.set([lid, view, info, bloom, burst, flash], { willChange: 'transform,opacity' });

        tl = gsap.timeline({
          defaults: { ease: 'power3.out' },
          onComplete: function () {
            gsap.set([lid, bloom, burst], { willChange: 'auto' });
            if (vw) vw.lockAuto(false);
          }
        });

        /* ① 呼吸：轻轻吸气般下压再回正 */
        tl.to(box, { scaleX: 1.03, scaleY: 0.975, duration: 0.5, ease: 'power2.inOut' }, 0)
          .to(box, { scaleX: 1, scaleY: 1, duration: 0.7, ease: 'power2.inOut' }, 0.5);
        tl.fromTo(card, { y: 0 }, { y: -6, duration: 0.6, ease: 'power2.out' }, 0)
          .to(card, { y: 0, duration: 0.8, ease: 'power2.inOut' }, 0.6);

        /* ② 掀盖：如首饰盒般缓缓翻开，再化作薄雾升起 */
        tl.to(lid, { rotationX: 74, transformOrigin: '50% 0', duration: 0.7, ease: 'power2.inOut' }, 0.55)
          .to(lid, { rotationX: 120, duration: 0.7, ease: 'power3.inOut' }, 1.25)
          .to(lid, { y: -82, opacity: 0, duration: 0.9, ease: 'power1.out' }, 1.25);

        /* 内部柔光随开盒隐去 */
        tl.to(inner, { opacity: 0, duration: 0.5 }, 0.9);
        /* 光晕在开盒瞬间微微亮起 */
        tl.to(halo, { opacity: 0.85, duration: 0.8, ease: 'power2.out' }, 0.7)
          .to(halo, { opacity: 0.6, duration: 1.2 }, 1.5);

        /* ③ 柔光绽放：光从匣心缓缓晕开 */
        tl.set(bloom, { opacity: 1, scale: 0.6 }, 0.7)
          .to(bloom, { scale: 1.15, opacity: 0.9, duration: 0.9, ease: 'power2.out' }, 0.7)
          .to(bloom, { opacity: 0, duration: 0.7, ease: 'power1.out' }, 1.5);

        /* ④ 光环 + 粒子（与掀盖同步迸发，柔和缓慢） */
        tl.set(burst, { opacity: 1 }, 0.85);
        Array.prototype.forEach.call(rings, function (r, i) {
          tl.fromTo(r, { scale: 0, opacity: 0.8 },
            { scale: 5 + i * 1.6, opacity: 0, duration: 1.0, ease: 'power2.out' }, 0.85 + i * 0.08);
        });
        Array.prototype.forEach.call(pts, function (p, i) {
          var a = (i / pts.length) * 6.283 + Math.random() * 0.5;
          var d = 60 + Math.random() * 95;
          tl.fromTo(p, { x: 0, y: 0, opacity: 1, scale: 1 },
            { x: Math.cos(a) * d, y: Math.sin(a) * d, opacity: 0, scale: 0.2,
              duration: 1.0 + Math.random() * 0.5, ease: 'power2.out' },
            0.88 + Math.random() * 0.16);
        });
        tl.to(burst, { opacity: 0, duration: 0.3 }, 1.6);

        /* ⑤ 盒身淡为微光，模型升起 */
        tl.to(base, { opacity: 0.14, duration: 0.8 }, 1.0);
        tl.fromTo(view, { opacity: 0, scale: 0.68, y: 70 },
          { opacity: 1, scale: 1, y: 0, duration: 1.15, ease: 'back.out(1.3)' }, 1.0);

        /* ⑥ 开盒微光在现身一刻轻绽 */
        tl.fromTo(flash, { scale: 0, opacity: 0 }, { scale: 1.05, opacity: 0.9, duration: 0.25, ease: 'power2.out' }, 1.0)
          .to(flash, { opacity: 0, scale: 1.25, duration: 0.6, ease: 'power1.out' }, 1.25);

        /* 模型旋入正面 */
        tl.add(function () {
          if (vw) vw.load().then(function (ok) {
            if (!ok || !vw.ready) return;
            vw.lockAuto(true);
            gsap.to(vw.pivot.rotation, {
              y: 0, duration: 1.6, ease: 'power2.out',
              onComplete: function () { vw.lockAuto(false); }
            });
          });
        }, 1.05);

        /* ⑦ 名牌滑入 */
        tl.fromTo(info, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7 }, 1.55)
          .fromTo(info.children, { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.55, stagger: 0.09 }, 1.6);
      }

      /* ── 重新封盒 ── */
      function close() {
        if (!opened) return; opened = false;
        if (current === card) current = null;
        card.classList.remove('opened');
        stage.setAttribute('aria-expanded', 'false');
        if (tl) tl.kill();
        var vw = viewers[file];
        if (vw) { vw.setOpen(false); vw.stop(); }

        if (gsap) {
          gsap.set(lid,   { rotationX: 0, rotationZ: 0, x: 0, y: 0, opacity: 1 });
          gsap.set(inner, { opacity: 0.5 });
          gsap.set(halo,  { opacity: 0.5 });
          gsap.set(base,  { opacity: 1 });
          gsap.set(box,   { rotationX: 0, rotationY: 0, rotationZ: 0, scaleX: 1, scaleY: 1 });
          gsap.set(view,  { opacity: 0, scale: 0.68, y: 70 });
          gsap.set(info,  { opacity: 0, y: 24 });
          gsap.set(bloom, { opacity: 0, scale: 0.6 });
          gsap.set(burst, { opacity: 0 });
          gsap.set(flash, { clearProps: 'all' });
          gsap.set(card,  { clearProps: 'transform' });
        }
        burst.querySelectorAll('.bb-pt').forEach(function (p) { p.remove(); });
        if (!REDUCE) box.classList.add('bb-float');
      }

      stage.addEventListener('click', open);
      stage.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
      });
      reset.addEventListener('click', function (e) { e.stopPropagation(); close(); });
      card._close = close;
    });
  });
});
</script>
</body>
</html>
